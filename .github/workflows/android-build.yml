name: Build X70i VV Compatibility Assistant

on:
  push:
    branches: [main]
    paths:
      - 'X70iVVCompat-AndroidStudio-Project.zip.b64'
      - '.github/workflows/android-build.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK platform and build tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Extract Android Studio project
        run: |
          base64 -d X70iVVCompat-AndroidStudio-Project.zip.b64 > X70iVVCompat-AndroidStudio-Project.zip
          unzip -t X70iVVCompat-AndroidStudio-Project.zip
          unzip -q X70iVVCompat-AndroidStudio-Project.zip

      - name: Build debug APK
        working-directory: X70iVVCompat
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK signature
        run: |
          APK="X70iVVCompat/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee X70iVVCompat-DEBUG-SHA256.txt

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: X70i-VV-Compat-Debug-APK
          path: |
            X70iVVCompat/app/build/outputs/apk/debug/app-debug.apk
            X70iVVCompat-DEBUG-SHA256.txt
          if-no-files-found: error
          retention-days: 30
