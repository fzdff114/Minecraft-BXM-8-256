name: Build X70i VV Compatibility Assistant

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK platform and build tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compile debug APK
        id: compile
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:assembleDebug --stacktrace --info > gradle-build.log 2>&1
          result=$?
          tail -n 180 gradle-build.log
          exit "$result"

      - name: Upload Gradle diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: X70i-VV-Gradle-Build-Log
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Verify APK signature and checksum
        if: success()
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee X70i-VV-Compat-SHA256.txt

      - name: Upload installable debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: X70i-VV-Compat-Debug-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            X70i-VV-Compat-SHA256.txt
          if-no-files-found: error
          retention-days: 30
 
      - name: Publish GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create x70i-vv-compat-v0.2.2-alpha.2 \
            app/build/outputs/apk/debug/app-debug.apk \
            X70i-VV-Compat-SHA256.txt \
            --target "$GITHUB_SHA" \
            --title "X70i VV Compatibility Assistant v0.2.2-alpha.2" \
            --notes "Debug test build for Honor X70i / PowerVR BXM-8-256. Adds continuous, filtered Shizuku logcat capture that starts before MB Loader launch and records the full Minecraft 26.62 startup transition through black-screen/fallback, plus current-user-only graphics package scan, per-app ANGLE override cleanup, backup/restore, and helper-process GLES diagnostics. Diagnostics run in the helper's own GLES context and do not prove Minecraft RenderDragon compatibility. This is not a modified Minecraft APK or a GPU driver." \
            --prerelease
