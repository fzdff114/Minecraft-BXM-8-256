plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fzdff.x70ivv'
    compileSdk 35

    buildFeatures {
        buildConfig true
        aidl true
    }

    defaultConfig {
        applicationId 'com.fzdff.x70ivv'
        minSdk 24
        targetSdk 35
        versionCode 9
        versionName '0.2.2-alpha.6'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
